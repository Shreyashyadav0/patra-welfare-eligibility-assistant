[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patra"
version = "1.0.0"
description = "Citation-grounded eligibility assistant for Indian welfare schemes (IGNOU MCA MCSP-232)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shreyash Yadav" }]
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "jinja2>=3.1.5",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.6.1",
  "numpy>=2.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[project.scripts]
patra = "patra.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patra = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]          # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]       # assert False is fine in a test helper

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
